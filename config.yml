###############################
cascade: # prevent content/news/* and content/pubs/* from being rendered as regular pages
  - _target:
      path: /news/**
    build:
      render: never
      list: local
  - _target:
      path: /pubs/**
    build:
      render: never
      list: local
  
frontmatter:
lastmod:
  - lastmod
  - :git
  - date
  - publishDate
###############################

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: /
          weight: 5
        # - name: Publications
        #   url: pubs/
        #   weight: 8
        - name: Blog
          url: blog/
          weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

